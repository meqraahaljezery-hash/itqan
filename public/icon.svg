<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Decorative frame -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Quran Rehal & Book Motif -->
  <g transform="translate(136, 140)">
    <!-- Book pages left and right -->
    <path d="M120 180 C80 150 20 160 0 165 L0 80 C30 75 80 65 120 95 Z" fill="#fdfbf7" stroke="#d97706" stroke-width="4"/>
    <path d="M120 180 C160 150 220 160 240 165 L240 80 C210 75 160 65 120 95 Z" fill="#fdfbf7" stroke="#d97706" stroke-width="4"/>
    <!-- Page lines -->
    <path d="M20 100 Q60 90 105 110" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M20 120 Q60 110 105 130" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M20 140 Q60 130 105 150" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M135 110 Q180 90 220 100" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M135 130 Q180 110 220 120" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M135 150 Q180 130 220 140" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Book spine & bookmark -->
    <path d="M120 95 L120 200" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 180 Q130 220 145 235 L135 235 Z" fill="#ef4444"/>
    
    <!-- Wooden stand (Rehal) legs -->
    <path d="M40 185 L10 230 C20 235 40 235 60 225 L100 175" fill="url(#gold)"/>
    <path d="M200 185 L230 230 C220 235 200 235 180 225 L140 175" fill="url(#gold)"/>
  </g>
  <!-- Crescent & Star accent -->
  <path d="M256 90 A25 25 0 0 0 280 65 A30 30 0 1 1 256 90 Z" fill="url(#gold)"/>
  <polygon points="266,60 268,66 274,66 269,70 271,76 266,72 261,76 263,70 258,66 264,66" fill="#fef08a"/>
</svg>
